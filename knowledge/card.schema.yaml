# Validation schema for knowledge cards (enforced by `dsx knowledge build`)
required: [id, title, stage, family, domain, type, applies_when, enforce, confidence, sources, added_by, added_on]
fields:
  id:          {type: string, pattern: "^[a-z-]+(\\.[a-z0-9-]+){2,}$"}   # <area>.<stage-or-topic>.<slug>
  title:       {type: string, max_len: 140}
  stage:       {type: list, enum: [business, data, eda, feature_understanding, feature_engineering, modeling, evaluation, deployment, monitoring]}
  family:      {type: list, enum: [classification, regression, forecasting, anomaly, any]}
  domain:      {type: list, enum: [fraud, demand, churn, credit, pricing, maintenance, marketing, healthcare, any]}
  type:        {type: string, enum: [principle, heuristic, checklist, question, metric, pitfall, technique, reference]}
  applies_when: {type: string}          # plain language; evaluated by the orchestrator against brief + data card
  enforce:     {type: string, enum: [advisory, gap_detector, reviewer, evaluator]}
  confidence:  {type: string, enum: [baseline, practitioner, validated]}
  sources:     {type: list, min_items: 1}
  added_by:    {type: string}
  added_on:    {type: date}
  supersedes:  {type: string, optional: true}   # id of a card this one replaces
  tags:        {type: list, optional: true}
body_sections_expected: ["Claim"]      # others optional: Why, How to apply, Pitfalls, Ask the user

notes:
  - domain/family value `any` is exclusive (do not combine with specific values)
  - file name must equal the id slug (last segment)

stage_to_plugin_stage:            # used by `dsx knowledge build` for playbooks, DoD and gap questions
  business: 1
  data: 2
  eda: 2
  feature_understanding: 2
  feature_engineering: 3
  modeling: 3
  evaluation: 3
  deployment: 4
  monitoring: 4
applied_cards_format: "[{id, hash}]   # hash = sha256 of the card file at the time of use"
